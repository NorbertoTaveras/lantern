site_name: Mobile Foundation SDK
site_description: Modular Android foundation SDK documentation.
site_url: https://norbertotaveras.github.io/android_mobilefoundation_framework/
repo_name: NorbertoTaveras/android_mobilefoundation_framework
repo_url: https://github.com/NorbertoTaveras/android_mobilefoundation_framework

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Core Patterns: core-patterns.md
  - Module Guide: modules.md
  - Authentication: authentication.md
  - Integrations: integrations.md
  - Publishing: publishing.md
