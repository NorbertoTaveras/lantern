site_name: Lantern
site_description: Modular Android foundation SDK documentation.
site_url: https://norbertotaveras.github.io/lantern/
repo_name: NorbertoTaveras/lantern
repo_url: https://github.com/NorbertoTaveras/lantern

theme:
  name: material
  language: en
  logo: assets/brand/lantern-logo-512.png
  favicon: assets/brand/lantern-logo-512.png
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

nav:
  - Overview: index.md
  - Getting Started: getting-started.md
  - Artifacts: artifacts.md
  - Versioning And Migration: versioning-migration.md
  - API Reference: api-reference.md
  - Core Patterns: core-patterns.md
  - Module Guide: modules.md
  - Modules:
      - SDK Core: modules/sdk-core.md
      - Logging: modules/logging.md
      - Auth Core: modules/auth-core.md
      - Firebase Auth: modules/auth-firebase.md
      - Google Auth: modules/auth-google.md
      - Firebase Google Auth: modules/auth-firebase-google.md
      - Permissions: modules/permissions.md
      - Secure Storage: modules/secure-storage.md
      - Network OkHttp: modules/network-okhttp.md
      - Remote Config: modules/remote-config.md
      - Feature Flags: modules/feature-flags.md
      - Notifications: modules/notifications.md
      - Media Picker: modules/media-picker.md
      - Analytics: modules/analytics.md
      - Deep Links: modules/deep-links.md
      - Background Work: modules/background-work.md
      - App Versioning: modules/app-versioning.md
  - Authentication: authentication.md
  - Integrations: integrations.md
  - Releases: publishing.md
