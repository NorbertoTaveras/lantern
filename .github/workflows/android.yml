name: Android CI

on:
  push:
    branches:
      - develop
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Validation
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      GITHUB_PACKAGES_REPOSITORY: ${{ vars.PACKAGES_REPOSITORY || 'NorbertoTaveras/android_mobilefoundation_packages' }}
      GITHUB_PACKAGES_USERNAME: ${{ vars.PACKAGES_USERNAME || github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      MOBILE_FOUNDATION_VERSION: 0.1.0-ci.${{ github.run_number }}-SNAPSHOT

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "platforms;android-37.1" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build SDK modules
        run: |
          ./gradlew \
            clean \
            :sdk-core:build \
            :logging:build \
            :auth-core:build \
            :auth-firebase:build \
            :auth-google:build \
            :auth-firebase-google:build \
            :permissions:build \
            :secure-storage:build \
            :network-okhttp:build \
            :remote-config:build \
            :remote-config-firebase:build \
            :feature-flags:build \
            :notifications:build \
            :notifications-firebase:build \
            :media-picker:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Run SDK lint
        run: |
          ./gradlew \
            :sdk-core:lint \
            :logging:lint \
            :auth-core:lint \
            :auth-firebase:lint \
            :auth-google:lint \
            :auth-firebase-google:lint \
            :permissions:lint \
            :secure-storage:lint \
            :network-okhttp:lint \
            :remote-config:lint \
            :remote-config-firebase:lint \
            :feature-flags:lint \
            :notifications:lint \
            :notifications-firebase:lint \
            :media-picker:lint \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Run SDK publishing readiness checks
        run: |
          ./gradlew \
            :checkPublishingReadiness \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven repository
        run: rm -rf build/local-maven

      - name: Publish SDK artifacts to local Maven
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Write sample app Firebase config
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            bash .github/scripts/write-ci-google-services-json.sh app/google-services.json
          fi

      - name: Build sample app from local SDK artifacts
        run: |
          ./gradlew \
            :app:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            -PSAMPLE_APP_MOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Build consumer smoke app
        run: |
          ./gradlew \
            -p consumer-smoke \
            :app:assembleDebug \
            -PCONSUMER_SMOKE_MOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Write build summary
        if: always()
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            firebase_config_source="secret"
          else
            firebase_config_source="ci-placeholder"
          fi

          {
            echo "## Android CI"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Firebase config source: ${firebase_config_source}"
            echo "- Validated SDK build, lint, publishing readiness, local Maven publication, sample app, and consumer smoke app."
            echo "- Published artifacts only to local Maven for validation. This workflow does not publish externally."
          } >> "$GITHUB_STEP_SUMMARY"
