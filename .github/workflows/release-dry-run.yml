name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Validate Release Without Publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release inputs
        run: bash .github/scripts/validate-release-version.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run SDK lint
        run: |
          ./gradlew \
            :sdk-core:lint \
            :logging:lint \
            :auth-core:lint \
            :auth-firebase:lint \
            :auth-google:lint \
            :auth-firebase-google:lint \
            :permissions:lint \
            :secure-storage:lint \
            :network-okhttp:lint \
            :remote-config:lint \
            :remote-config-firebase:lint \
            :feature-flags:lint \
            :notifications:lint \
            :notifications-firebase:lint \
            :media-picker:lint \
            --no-configuration-cache \
            --max-workers=2

      - name: Build SDK modules
        run: |
          ./gradlew \
            :sdk-core:build \
            :logging:build \
            :auth-core:build \
            :auth-firebase:build \
            :auth-google:build \
            :auth-firebase-google:build \
            :permissions:build \
            :secure-storage:build \
            :network-okhttp:build \
            :remote-config:build \
            :remote-config-firebase:build \
            :feature-flags:build \
            :notifications:build \
            :notifications-firebase:build \
            :media-picker:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven dry-run repository
        run: rm -rf build/local-maven

      - name: Publish local Maven dry run
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Write sample app Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build sample app
        if: env.GOOGLE_SERVICES_JSON != ''
        run: ./gradlew :app:build --no-configuration-cache --max-workers=2

      - name: Prepare Maven dry-run artifacts
        run: python3 .github/scripts/prepare-maven-artifacts.py --dry-run

      - name: Upload Maven dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}-dry-run
          path: |
            build/local-maven
            build/mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}-dry-run.tgz
            build/release-dry-run-provenance.json
          if-no-files-found: error

      - name: Write release dry-run summary
        run: |
          {
            echo "## Release dry run"
            echo
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Published only to local Maven output."
            echo "- No GitHub Packages publish or GitHub Release was created."
          } >> "$GITHUB_STEP_SUMMARY"
