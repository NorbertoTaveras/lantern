name: Release Dry Run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-dry-run-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Validate Release Without Publishing
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve release version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#release/}"

          if [[ -z "$version" || "$version" == "$GITHUB_REF_NAME" ]]; then
            echo "Release dry runs must run from release/{version} branches."
            exit 1
          fi

          if [[ "$version" == *SNAPSHOT* ]]; then
            echo "Release branch versions must not contain SNAPSHOT."
            exit 1
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release branch versions must use x.y.z or x.y.z-prerelease."
            exit 1
          fi

          echo "MOBILE_FOUNDATION_VERSION=$version" >> "$GITHUB_ENV"

      - name: Validate release tag is unused
        shell: bash
        run: |
          tag="v${MOBILE_FOUNDATION_VERSION}"

          if git ls-remote --tags origin "refs/tags/${tag}" | grep -q .; then
            echo "Release tag ${tag} already exists."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run SDK lint
        run: |
          ./gradlew \
            :sdk-core:lint \
            :logging:lint \
            :auth-core:lint \
            :auth-firebase:lint \
            :auth-google:lint \
            :auth-firebase-google:lint \
            :permissions:lint \
            :secure-storage:lint \
            :network-okhttp:lint \
            :remote-config:lint \
            :remote-config-firebase:lint \
            :feature-flags:lint \
            :notifications:lint \
            :notifications-firebase:lint \
            :media-picker:lint \
            --no-configuration-cache \
            --max-workers=2

      - name: Build SDK modules
        run: |
          ./gradlew \
            :sdk-core:build \
            :logging:build \
            :auth-core:build \
            :auth-firebase:build \
            :auth-google:build \
            :auth-firebase-google:build \
            :permissions:build \
            :secure-storage:build \
            :network-okhttp:build \
            :remote-config:build \
            :remote-config-firebase:build \
            :feature-flags:build \
            :notifications:build \
            :notifications-firebase:build \
            :media-picker:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven dry-run repository
        run: rm -rf build/local-maven

      - name: Publish local Maven dry run
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Write sample app Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build sample app
        if: env.GOOGLE_SERVICES_JSON != ''
        run: ./gradlew :app:build --no-configuration-cache --max-workers=2

      - name: Generate Maven dry-run checksums
        run: |
          cd build/local-maven
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS

      - name: Generate dry-run provenance
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          local_maven = Path("build/local-maven")
          modules = []

          for pom in sorted(local_maven.rglob("*.pom")):
              root = ET.parse(pom).getroot()
              namespace = {"m": root.tag.split("}")[0].strip("{")} if root.tag.startswith("{") else {}

              def text(name):
                  path = f"m:{name}" if namespace else name
                  value = root.findtext(path, namespaces=namespace)
                  return value or ""

              modules.append(
                  {
                      "groupId": text("groupId"),
                      "artifactId": text("artifactId"),
                      "version": text("version"),
                      "pom": str(pom.relative_to(local_maven)),
                  }
              )

          provenance = {
              "name": "Mobile Foundation SDK",
              "dryRun": True,
              "version": os.environ["MOBILE_FOUNDATION_VERSION"],
              "tag": f"v{os.environ['MOBILE_FOUNDATION_VERSION']}",
              "branch": os.environ["GITHUB_REF_NAME"],
              "commit": os.environ["GITHUB_SHA"],
              "repository": os.environ["GITHUB_REPOSITORY"],
              "runId": os.environ["GITHUB_RUN_ID"],
              "runAttempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "mavenRepository": "build/local-maven",
              "checksumFile": "SHA256SUMS",
              "bundleFile": f"mobile-foundation-maven-{os.environ['MOBILE_FOUNDATION_VERSION']}-dry-run.tgz",
              "artifactFileCount": sum(1 for path in local_maven.rglob("*") if path.is_file()),
              "modules": modules,
          }

          output = Path("build/release-dry-run-provenance.json")
          output.write_text(json.dumps(provenance, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Package Maven dry-run bundle
        run: |
          tar -czf "build/mobile-foundation-maven-${MOBILE_FOUNDATION_VERSION}-dry-run.tgz" -C build/local-maven .

      - name: Upload Maven dry-run artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}-dry-run
          path: |
            build/local-maven
            build/mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}-dry-run.tgz
            build/release-dry-run-provenance.json
          if-no-files-found: error

      - name: Write release dry-run summary
        run: |
          {
            echo "## Release dry run"
            echo
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Published only to local Maven output."
            echo "- No GitHub Packages publish or GitHub Release was created."
          } >> "$GITHUB_STEP_SUMMARY"
