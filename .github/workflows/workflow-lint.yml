name: Workflow Lint

on:
  pull_request:
  push:
    branches:
      - develop
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras'

    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install actionlint
        shell: bash
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          url="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"

          curl -fsSLo "$archive" "$url"
          echo "${ACTIONLINT_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" actionlint
          sudo mv actionlint /usr/local/bin/actionlint

      - name: Lint workflows
        run: actionlint -color

      - name: Write workflow lint summary
        if: always()
        run: |
          {
            echo "## Workflow lint"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Linter: actionlint ${ACTIONLINT_VERSION}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
