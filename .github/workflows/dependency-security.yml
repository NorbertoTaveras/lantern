name: Dependency Security

on:
  workflow_dispatch:
  schedule:
    - cron: "24 10 * * 1"

permissions:
  contents: write

concurrency:
  group: dependency-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    name: Submit Gradle Dependency Graph
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up JDK
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36" \
            "platforms;android-37" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate and submit dependency graph
        uses: gradle/actions/dependency-submission@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          dependency-graph: generate-submit-and-upload

      - name: Write dependency security summary
        if: always()
        run: |
          {
            echo "## Dependency security"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Submitted the Gradle dependency graph for Dependabot alerts."
            echo "- Uploaded the generated dependency graph artifact for auditability."
            echo "- Source ref: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
          } >> "$GITHUB_STEP_SUMMARY"
