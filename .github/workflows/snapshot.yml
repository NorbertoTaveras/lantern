name: Snapshot

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: Snapshot version, for example 0.1.0-SNAPSHOT.
        required: true
        default: 0.1.0-SNAPSHOT

permissions:
  contents: read
  packages: write

concurrency:
  group: snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-snapshot:
    name: Validate Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')
    outputs:
      mobile-foundation-version: ${{ steps.snapshot-version.outputs.mobile-foundation-version }}

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      GITHUB_PACKAGES_REPOSITORY: ${{ vars.PACKAGES_REPOSITORY || 'NorbertoTaveras/android_mobilefoundation_packages' }}
      GITHUB_PACKAGES_USERNAME: ${{ vars.PACKAGES_USERNAME || github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      MOBILE_FOUNDATION_BASE_VERSION: ${{ inputs.base_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub Packages credentials
        if: env.GITHUB_PACKAGES_TOKEN == ''
        run: |
          echo "PACKAGES_TOKEN is required to publish private SDK packages to ${GITHUB_PACKAGES_REPOSITORY}."
          exit 1

      - name: Resolve develop snapshot version
        id: snapshot-version
        run: bash .github/scripts/resolve-develop-snapshot-version.sh

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "platforms;android-37.1" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build SDK modules
        run: |
          ./gradlew \
            clean \
            :sdk-core:build \
            :logging:build \
            :auth-core:build \
            :auth-firebase:build \
            :auth-google:build \
            :auth-firebase-google:build \
            :permissions:build \
            :secure-storage:build \
            :network-okhttp:build \
            :remote-config:build \
            :remote-config-firebase:build \
            :feature-flags:build \
            :notifications:build \
            :notifications-firebase:build \
            :media-picker:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Run SDK lint
        run: |
          ./gradlew \
            :sdk-core:lint \
            :logging:lint \
            :auth-core:lint \
            :auth-firebase:lint \
            :auth-google:lint \
            :auth-firebase-google:lint \
            :permissions:lint \
            :secure-storage:lint \
            :network-okhttp:lint \
            :remote-config:lint \
            :remote-config-firebase:lint \
            :feature-flags:lint \
            :notifications:lint \
            :notifications-firebase:lint \
            :media-picker:lint \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Run SDK publishing readiness checks
        run: |
          ./gradlew \
            :checkPublishingReadiness \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven snapshot repository
        run: rm -rf build/local-maven

      - name: Publish local Maven snapshot
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Write sample app Firebase config
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            bash .github/scripts/write-ci-google-services-json.sh app/google-services.json
          fi

      - name: Build sample app from local SDK artifacts
        run: |
          ./gradlew \
            :app:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            -PSAMPLE_APP_MOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Build minified consumer smoke app
        run: |
          ./gradlew \
            -p consumer-smoke \
            :app:assembleRelease \
            -PCONSUMER_SMOKE_MOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Check duplicate GitHub package versions
        run: bash .github/scripts/check-github-package-version.sh
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Write snapshot validation summary
        if: always()
        run: |
          {
            echo "## Snapshot validation"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Validated SDK build, lint, publishing readiness, local Maven publication, duplicate GitHub Packages versions, sample app, and minified consumer smoke app."
            echo "- No external publish happens until the protected github-packages environment approves the publish job."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-snapshot:
    name: Publish Private Snapshot
    needs: validate-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')
    environment: github-packages

    env:
      MOBILE_FOUNDATION_VERSION: ${{ needs.validate-snapshot.outputs.mobile-foundation-version }}
      GITHUB_PACKAGES_REPOSITORY: ${{ vars.PACKAGES_REPOSITORY || 'NorbertoTaveras/android_mobilefoundation_packages' }}
      GITHUB_PACKAGES_USERNAME: ${{ vars.PACKAGES_USERNAME || github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub Packages credentials
        if: env.GITHUB_PACKAGES_TOKEN == ''
        run: |
          echo "PACKAGES_TOKEN is required to publish private SDK packages to ${GITHUB_PACKAGES_REPOSITORY}."
          exit 1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "platforms;android-37.1" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare local Maven snapshot repository
        run: rm -rf build/local-maven

      - name: Publish local Maven snapshot
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Check duplicate GitHub package versions
        run: bash .github/scripts/check-github-package-version.sh
        env:
          GH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}

      - name: Publish GitHub Packages snapshot
        run: |
          ./gradlew \
            publishAllPublicationsToGitHubPackagesRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Write snapshot publish summary
        if: always()
        run: |
          {
            echo "## Snapshot publish"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Environment: github-packages"
            echo "- Published private snapshot artifacts to GitHub Packages after protected environment approval."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure guidance
        if: failure()
        run: |
          {
            echo "## Snapshot publish troubleshooting"
            echo
            echo "- Confirm the github-packages environment approval was granted."
            echo "- Confirm PACKAGES_TOKEN has read:packages, write:packages, and access to the private package repository."
            echo "- Confirm the snapshot version was not already published."
          } >> "$GITHUB_STEP_SUMMARY"
