name: Build

on:
  pull_request:
  push:
    branches:
      - develop
      - "release/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      GITHUB_PACKAGES_REPOSITORY: ${{ vars.GITHUB_PACKAGES_REPOSITORY || 'NorbertoTaveras/android_mobilefoundation_packages' }}
      GITHUB_PACKAGES_USERNAME: ${{ vars.GITHUB_PACKAGES_USERNAME || github.actor }}
      GITHUB_PACKAGES_TOKEN: ${{ secrets.GITHUB_PACKAGES_TOKEN }}
      MOBILE_FOUNDATION_VERSION: 0.1.0-ci.${{ github.run_number }}-SNAPSHOT

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check GitHub Packages credentials
        if: env.GITHUB_PACKAGES_TOKEN == ''
        run: |
          echo "GITHUB_PACKAGES_TOKEN is required to read private SDK packages from ${GITHUB_PACKAGES_REPOSITORY}."
          exit 1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "platforms;android-37.1" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Write sample app Firebase config
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          else
            bash .github/scripts/write-ci-google-services-json.sh app/google-services.json
          fi

      - name: Build project
        run: |
          ./gradlew \
            clean \
            build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Run SDK publishing readiness checks
        run: |
          ./gradlew \
            :checkPublishingReadiness \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven repository
        run: rm -rf build/local-maven

      - name: Publish SDK artifacts to local Maven
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Build consumer smoke app
        run: |
          ./gradlew \
            -p consumer-smoke \
            :app:assembleDebug \
            -PCONSUMER_SMOKE_MOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Upload local Maven artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-foundation-build-maven-${{ env.MOBILE_FOUNDATION_VERSION }}
          path: build/local-maven
          if-no-files-found: error

      - name: Upload sample app APKs
        if: env.GOOGLE_SERVICES_JSON != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-foundation-sample-app-${{ github.run_number }}
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Upload consumer smoke APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mobile-foundation-consumer-smoke-${{ github.run_number }}
          path: consumer-smoke/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Write build summary
        if: always()
        run: |
          if [[ -n "$GOOGLE_SERVICES_JSON" ]]; then
            firebase_config_source="secret"
          else
            firebase_config_source="ci-placeholder"
          fi

          {
            echo "## Build"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Firebase config source: ${firebase_config_source}"
            echo "- Validated SDK publishing readiness checks."
            echo "- Published SDK artifacts to local Maven for consumer smoke testing."
          } >> "$GITHUB_STEP_SUMMARY"
