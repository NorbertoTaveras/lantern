name: Publish Android Library

on:
  push:
    branches:
      - "release/**"

permissions:
  contents: write
  packages: write

concurrency:
  group: release-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: Validate Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')
    outputs:
      mobile-foundation-version: ${{ steps.version.outputs.mobile-foundation-version }}

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Validate release inputs
        id: version
        run: bash .github/scripts/validate-release-version.sh

      - name: Set up JDK
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "platforms;android-37.1" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run SDK lint
        run: |
          ./gradlew \
            :sdk-core:lint \
            :logging:lint \
            :auth-core:lint \
            :auth-firebase:lint \
            :auth-google:lint \
            :auth-firebase-google:lint \
            :permissions:lint \
            :secure-storage:lint \
            :network-okhttp:lint \
            :remote-config:lint \
            :remote-config-firebase:lint \
            :feature-flags:lint \
            :notifications:lint \
            :notifications-firebase:lint \
            :media-picker:lint \
            --no-configuration-cache \
            --max-workers=2

      - name: Build SDK modules
        run: |
          ./gradlew \
            :sdk-core:build \
            :logging:build \
            :auth-core:build \
            :auth-firebase:build \
            :auth-google:build \
            :auth-firebase-google:build \
            :permissions:build \
            :secure-storage:build \
            :network-okhttp:build \
            :remote-config:build \
            :remote-config-firebase:build \
            :feature-flags:build \
            :notifications:build \
            :notifications-firebase:build \
            :media-picker:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Run SDK publishing readiness checks
        run: |
          ./gradlew \
            :checkPublishingReadiness \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven release repository
        run: rm -rf build/local-maven

      - name: Publish local Maven release
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Write sample app Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build sample app
        if: env.GOOGLE_SERVICES_JSON != ''
        run: ./gradlew :app:build --no-configuration-cache --max-workers=2

      - name: Build consumer smoke app
        run: |
          ./gradlew \
            -p consumer-smoke \
            :app:assembleDebug \
            -PCONSUMER_SMOKE_MOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare Maven release artifacts
        run: python3 .github/scripts/prepare-maven-artifacts.py

      - name: Check duplicate GitHub package versions
        run: bash .github/scripts/check-github-package-version.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        run: bash .github/scripts/write-release-notes.sh build/release-notes.md

      - name: Upload local Maven release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}
          path: |
            build/local-maven
            build/mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}.tgz
            build/release-provenance.json
            build/release-assets/*
            build/release-notes.md
          if-no-files-found: error

      - name: Write release validation summary
        if: always()
        run: |
          {
            echo "## Release validation"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Validated lint, builds, publishing readiness, duplicate package versions, release assets, and release notes."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-library:
    name: Publish Android Library
    needs: validate-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')
    environment: github-packages

    env:
      MOBILE_FOUNDATION_VERSION: ${{ needs.validate-release.outputs.mobile-foundation-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@d7793b545071e98d581d3bf084a51c3213318a07 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "platforms;android-37.1" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Prepare local Maven release repository
        run: rm -rf build/local-maven

      - name: Publish local Maven release
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Check duplicate GitHub package versions
        run: bash .github/scripts/check-github-package-version.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish GitHub Packages release
        run: |
          ./gradlew \
            publishAllPublicationsToGitHubPackagesRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Prepare Maven release artifacts
        run: python3 .github/scripts/prepare-maven-artifacts.py

      - name: Generate release notes
        run: bash .github/scripts/write-release-notes.sh build/release-notes.md

      - name: Create GitHub release
        run: |
          gh release create "v${MOBILE_FOUNDATION_VERSION}" \
            "build/mobile-foundation-maven-${MOBILE_FOUNDATION_VERSION}.tgz#Mobile Foundation Maven ${MOBILE_FOUNDATION_VERSION}" \
            "build/release-provenance.json#Release provenance ${MOBILE_FOUNDATION_VERSION}" \
            build/release-assets/* \
            --target "$GITHUB_SHA" \
            --title "Mobile Foundation SDK ${MOBILE_FOUNDATION_VERSION}" \
            --notes-file build/release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write release publish summary
        if: always()
        run: |
          {
            echo "## Release publish"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Version: ${MOBILE_FOUNDATION_VERSION}"
            echo "- Environment: github-packages"
            echo "- Published to GitHub Packages after duplicate-version validation."
            echo "- Created GitHub release v${MOBILE_FOUNDATION_VERSION} with Maven archive, provenance, staged AAR/POM/module assets, and release notes."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish failure guidance
        if: failure()
        run: |
          {
            echo "## Release publish troubleshooting"
            echo
            echo "- Confirm the github-packages environment approval was granted."
            echo "- Confirm the workflow token has contents:write and packages:write permissions."
            echo "- Confirm v${MOBILE_FOUNDATION_VERSION} and its GitHub Packages versions do not already exist."
            echo "- Check MAVEN_SIGNING_KEY and MAVEN_SIGNING_PASSWORD only if signing tasks failed."
          } >> "$GITHUB_STEP_SUMMARY"
