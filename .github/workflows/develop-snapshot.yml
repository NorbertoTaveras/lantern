name: Publish Develop Snapshot

on:
  workflow_dispatch:
    inputs:
      base_version:
        description: Base snapshot version, for example 0.1.0-SNAPSHOT.
        required: true
        default: 0.1.0-SNAPSHOT

permissions:
  contents: read
  packages: write

concurrency:
  group: develop-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-snapshot:
    name: Validate Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      mobile-foundation-version: ${{ steps.snapshot-version.outputs.mobile-foundation-version }}

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      MOBILE_FOUNDATION_BASE_VERSION: ${{ inputs.base_version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Resolve develop snapshot version
        id: snapshot-version
        run: bash .github/scripts/resolve-develop-snapshot-version.sh

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run SDK lint
        run: |
          ./gradlew \
            :sdk-core:lint \
            :logging:lint \
            :auth-core:lint \
            :auth-firebase:lint \
            :auth-google:lint \
            :auth-firebase-google:lint \
            :permissions:lint \
            :secure-storage:lint \
            :network-okhttp:lint \
            :remote-config:lint \
            :remote-config-firebase:lint \
            :feature-flags:lint \
            :notifications:lint \
            :notifications-firebase:lint \
            :media-picker:lint \
            --no-configuration-cache \
            --max-workers=2

      - name: Build SDK modules
        run: |
          ./gradlew \
            :sdk-core:build \
            :logging:build \
            :auth-core:build \
            :auth-firebase:build \
            :auth-google:build \
            :auth-firebase-google:build \
            :permissions:build \
            :secure-storage:build \
            :network-okhttp:build \
            :remote-config:build \
            :remote-config-firebase:build \
            :feature-flags:build \
            :notifications:build \
            :notifications-firebase:build \
            :media-picker:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven snapshot repository
        run: rm -rf build/local-maven

      - name: Publish local Maven snapshot
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2
        env:
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}

      - name: Write sample app Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build sample app
        if: env.GOOGLE_SERVICES_JSON != ''
        run: ./gradlew :app:build --no-configuration-cache --max-workers=2

      - name: Prepare Maven snapshot artifacts
        run: python3 .github/scripts/prepare-maven-artifacts.py --snapshot

      - name: Upload local Maven snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}
          path: |
            build/local-maven
            build/mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}-snapshot.tgz
            build/snapshot-provenance.json
            build/release-assets/*
          if-no-files-found: error

  publish-snapshot:
    name: Publish Develop Snapshot
    needs: validate-snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: github-packages

    env:
      MOBILE_FOUNDATION_VERSION: ${{ needs.validate-snapshot.outputs.mobile-foundation-version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Publish GitHub Packages snapshot
        run: |
          ./gradlew \
            publishAllPublicationsToGitHubPackagesRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAVEN_SIGNING_KEY: ${{ secrets.MAVEN_SIGNING_KEY }}
          MAVEN_SIGNING_PASSWORD: ${{ secrets.MAVEN_SIGNING_PASSWORD }}
