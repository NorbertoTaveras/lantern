name: Develop Snapshot

on:
  workflow_dispatch:
    inputs:
      version:
        description: Snapshot version to build from develop.
        required: true
        default: 0.1.0-SNAPSHOT

permissions:
  contents: read

concurrency:
  group: develop-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  snapshot:
    name: Build Snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      MOBILE_FOUNDATION_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate develop snapshot inputs
        shell: bash
        run: |
          if [[ "${GITHUB_REF_NAME}" != "develop" ]]; then
            echo "Develop snapshots must be run from the develop branch."
            exit 1
          fi

          if [[ ! "$MOBILE_FOUNDATION_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?-SNAPSHOT$ ]]; then
            echo "Develop snapshot versions must use x.y.z-SNAPSHOT or x.y.z-prerelease-SNAPSHOT."
            exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run SDK lint
        run: |
          ./gradlew \
            :sdk-core:lint \
            :logging:lint \
            :auth-core:lint \
            :auth-firebase:lint \
            :auth-google:lint \
            :auth-firebase-google:lint \
            :permissions:lint \
            :secure-storage:lint \
            :network-okhttp:lint \
            :remote-config:lint \
            :remote-config-firebase:lint \
            :feature-flags:lint \
            :notifications:lint \
            :notifications-firebase:lint \
            :media-picker:lint \
            --no-configuration-cache \
            --max-workers=2

      - name: Build SDK modules
        run: |
          ./gradlew \
            :sdk-core:build \
            :logging:build \
            :auth-core:build \
            :auth-firebase:build \
            :auth-google:build \
            :auth-firebase-google:build \
            :permissions:build \
            :secure-storage:build \
            :network-okhttp:build \
            :remote-config:build \
            :remote-config-firebase:build \
            :feature-flags:build \
            :notifications:build \
            :notifications-firebase:build \
            :media-picker:build \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Prepare local Maven snapshot repository
        run: rm -rf build/local-maven

      - name: Publish local Maven snapshot
        run: |
          ./gradlew \
            publishAllPublicationsToMobileFoundationLocalRepository \
            -PMOBILE_FOUNDATION_VERSION="$MOBILE_FOUNDATION_VERSION" \
            --no-configuration-cache \
            --max-workers=2

      - name: Write sample app Firebase config
        if: env.GOOGLE_SERVICES_JSON != ''
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json

      - name: Build sample app
        if: env.GOOGLE_SERVICES_JSON != ''
        run: ./gradlew :app:build --no-configuration-cache --max-workers=2

      - name: Generate Maven snapshot checksums
        run: |
          cd build/local-maven
          find . -type f ! -name SHA256SUMS -print0 | sort -z | xargs -0 shasum -a 256 > SHA256SUMS

      - name: Upload local Maven snapshot
        uses: actions/upload-artifact@v4
        with:
          name: mobile-foundation-maven-${{ env.MOBILE_FOUNDATION_VERSION }}
          path: build/local-maven
          if-no-files-found: error
