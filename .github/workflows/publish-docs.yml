name: Publish Docs

on:
  pull_request:
    branches:
      - develop
      - "release/**"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/publish-docs.yml"
  push:
    branches:
      - develop
      - "release/**"
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "gradle/**"
      - "build.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/publish-docs.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: publish-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-docs:
    name: Build Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Install Android SDK packages
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platforms;android-36.1" \
            "platforms;android-37.1" \
            "build-tools;36.1.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Generate API reference docs
        run: |
          ./gradlew \
            :generatePublicApiDocs \
            -PMOBILE_FOUNDATION_SOURCE_REF="${GITHUB_SHA}" \
            --no-configuration-cache \
            --max-workers=2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install docs dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Build docs
        run: mkdocs build --strict --site-dir site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Write docs build summary
        if: always()
        run: |
          {
            echo "## Publish Docs / Build"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Generated SDK API reference docs with Dokka."
            echo "- Built the Material for MkDocs documentation site from docs/."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-docs:
    name: Deploy Docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-docs
    if: github.event_name != 'pull_request' && (github.repository_owner == 'NorbertoTaveras' || github.repository_owner == 'norbertotaveras') && (github.actor == 'NorbertoTaveras' || github.actor == 'norbertotaveras')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Write docs deployment summary
        if: always()
        run: |
          {
            echo "## Publish Docs / Deploy"
            echo
            echo "- Status: ${{ job.status }}"
            echo "- Branch: ${GITHUB_REF_NAME}"
            echo "- Commit: ${GITHUB_SHA}"
            echo "- URL: ${{ steps.deployment.outputs.page_url }}"
          } >> "$GITHUB_STEP_SUMMARY"
